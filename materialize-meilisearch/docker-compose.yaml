services:
  meilisearch:
    image: getmeili/meilisearch-enterprise:latest
    ports:
      # Published on a fixed port, which the test configuration connects to.
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=masterKey
      - MEILI_NO_ANALYTICS=true
      - MEILI_EXPERIMENTAL_ALLOWED_IP_NETWORKS=any
    healthcheck:
      test: curl -s http://localhost:7700/health >/dev/null || exit 1
      interval: 1s
      timeout: 1s
      retries: 60
    networks:
      - flow-test

networks:
  flow-test:
    name: flow-test
    external: true
